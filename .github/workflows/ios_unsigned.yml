name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: https://service.saliya.top/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      API_BASE: ${{ github.event.inputs.api_base || 'http://127.0.0.1:8000/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Install CocoaPods
        run: |
          pod repo update
          pod install
        working-directory: mobile_app/ios

      - name: Build unsigned IPA
        run: flutter build ipa --no-codesign --release --dart-define API_BASE=${{ env.API_BASE }}
        working-directory: mobile_app

      - name: Locate IPA
        run: ls -al build/ios/ipa
        working-directory: mobile_app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: mobile_app/build/ios/ipa/Runner.ipa
