name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: https://service.saliya.top/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      API_BASE: ${{ github.event.inputs.api_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.5'

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile_app/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile_app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile_app/ios/Podfile.lock') }}

      - name: Install CocoaPods
        run: |
          pod repo update
          pod install
        working-directory: mobile_app/ios

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define API_BASE=${API_BASE:-http://127.0.0.1:8000/api/v1}
        working-directory: mobile_app

      - name: Xcode build (codesign disabled)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build
        working-directory: mobile_app

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          cd Payload
          zip -r ../Runner.ipa .
        working-directory: mobile_app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: mobile_app/Runner.ipa
