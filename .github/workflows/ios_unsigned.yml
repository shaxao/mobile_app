name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: https://service.saliya.top/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      API_BASE: ${{ github.event.inputs.api_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Flutter build bundle
        run: flutter build bundle --release --dart-define API_BASE=${API_BASE:-https://service.saliya.top/api/v1}
        working-directory: mobile_app

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            mobile_app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Install CocoaPods
        run: |
          pod repo update
          pod install
        working-directory: mobile_app/ios

      - name: Precache iOS artifacts
        run: flutter precache --ios
        working-directory: mobile_app

      # 使用 Xcode 禁签构建 Runner.app（完全绕过签名校验）
      # 移除额外的 xcodebuild 禁签构建，完全依赖 flutter 构建输出

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          else
            echo "Runner.app not found in build/ios/iphoneos. Attempting flutter build ios..."
            flutter build ios --release --no-codesign --dart-define API_BASE=${API_BASE:-https://service.saliya.top/api/v1}
            cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          fi
          cd Payload
          zip -r ../Runner.ipa .
        shell: bash
        working-directory: mobile_app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: mobile_app/Runner.ipa
