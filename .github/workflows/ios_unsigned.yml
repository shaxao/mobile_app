name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: http://111.229.184.169:8000/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Build iOS (no codesign)
        run: |
         API="${{ github.event.inputs.api_base }}"
         if [ -z "$API" ]; then API="http://111.229.184.169:8000/api/v1"; fi
         flutter build ios --release --no-codesign --dart-define API_BASE=$API
        working-directory: mobile_app

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R mobile_app/build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Runner.ipa Payload
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: Runner.ipa
