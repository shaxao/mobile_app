name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: https://service.saliya.top/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      API_BASE: ${{ github.event.inputs.api_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ github.run_id }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Flutter build bundle
        run: flutter build bundle --release --dart-define API_BASE=${API_BASE:-https://service.saliya.top/api/v1}
        working-directory: mobile_app
      

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            mobile_app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ github.run_id }}

      - name: Install CocoaPods
        run: |
          pod repo update
          pod install
        working-directory: mobile_app/ios

      - name: Precache iOS artifacts
        run: flutter precache --ios
        working-directory: mobile_app

      # 使用 Xcode 禁签构建 Runner.app（完全绕过签名校验）
      - name: Xcode build (codesign disabled)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_STYLE=Manual \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            archive -archivePath build/Runner.xcarchive
        working-directory: mobile_app

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Runner.xcarchive/Products/Applications/Runner.app Payload/Runner.app
          zip -r Runner.ipa Payload
        shell: bash
        working-directory: mobile_app

