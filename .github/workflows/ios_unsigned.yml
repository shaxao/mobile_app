name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base url
        required: true
        default: https://service.saliya.top/api/v1
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      API_BASE: ${{ github.event.inputs.api_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ github.run_id }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile_app

      - name: Flutter build bundle
        run: flutter build bundle --release --dart-define API_BASE=${API_BASE:-https://service.saliya.top/api/v1}
        working-directory: mobile_app
      

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            mobile_app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ github.run_id }}

      - name: Install CocoaPods
        run: |
          pod repo update
          pod install
        working-directory: mobile_app/ios

      - name: Precache iOS artifacts
        run: flutter precache --ios
        working-directory: mobile_app

      # 使用 Xcode 禁签构建 Runner.app（完全绕过签名校验）
      - name: Xcode build (codesign disabled)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_STYLE=Manual \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build
        working-directory: mobile_app

      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          else
            echo "Runner.app not found in build/ios/iphoneos. Searching DerivedData for Xcode build output..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Build" -maxdepth 3 -print 2>/dev/null | head -n 1)
            RUNNER_APP=$(find "$APP_PATH" -type d -path "*/Products/Release-iphoneos/Runner.app" -print 2>/dev/null | head -n 1)
            cp -R "$RUNNER_APP" Payload/Runner.app
          fi
          cd Payload
          zip -r ../Runner.ipa .
        shell: bash
        working-directory: mobile_app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: mobile_app/Runner.ipa
