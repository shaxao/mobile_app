<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>读取Excel并显示表格</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>

  <!-- 本地API服务配置 -->
  <script>
    // 本地API服务配置
    const API_BASE_URL = 'http://localhost:3001/api';
    let isLocalServerEnabled = true; // 是否启用本地服务器
    let isOnline = navigator.onLine; // 网络状态

    // 检查本地服务器是否可用
    async function checkLocalServer() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒超时

        const response = await fetch(`${API_BASE_URL}/health`, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          signal: controller.signal,
          headers: {
            'Content-Type': 'application/json',
          }
        });

        clearTimeout(timeoutId);

        if (response.ok) {
          isLocalServerEnabled = true;
          console.log('本地同步服务器连接成功');
          return true;
        }
      } catch (error) {
        console.log('本地同步服务器不可用，使用纯本地存储', error);
        isLocalServerEnabled = false;
      }
      return false;
    }

    // 等待本地服务器检查完成
    function waitForServerCheck() {
      return new Promise((resolve) => {
        checkLocalServer().then(resolve);
      });
    }

    // 监听网络状态变化
    window.addEventListener('online', () => {
      isOnline = true;
      console.log('网络已连接，检查本地服务器');
      checkLocalServer().then(() => {
        if (isLocalServerEnabled) {
          syncLocalToServer(); // 网络恢复时同步本地数据到服务器
        }
      });
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      console.log('网络已断开，使用本地存储');
    });
  </script>
  <style>
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #eee;
    }

    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      /* 避免 iOS 缩放 */
    }

    /* 手机端优化 */
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    input[type="file"] {
      font-size: 16px;
      line-height: 1.2;
      padding: 8px 12px;
    }

    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f7f7f7;
    }

    td,
    th {
      word-break: break-word;
    }

    th.copyable {
      color: #333;
    }

    th.copyable::after {
      content: ' ⧉';
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 768px) {

      th,
      td {
        padding: 8px 6px;
      }
    }

    /* —— Modern grayscale mobile-first theme —— */
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #e6e6e6;
      --soft: #f7f7f7;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: saturate(180%) blur(8px);
    }

    .controls input[type="file"] {
      font-size: 16px;
      color: var(--muted);
    }

    button {
      appearance: none;
      border: 1px solid #000;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      letter-spacing: 0.3px;
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .2);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .2);
    }

    button:disabled {
      background: var(--muted);
      border-color: var(--muted);
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 2px solid #000;
      outline-offset: 2px;
    }

    /* 保存按钮特殊样式 */
    #saveBtn {
      background: #28a745;
      border-color: #28a745;
    }

    #saveBtn:hover:not(:disabled) {
      background: #218838;
      border-color: #218838;
    }

    #saveBtn:disabled {
      background: var(--muted);
      border-color: var(--muted);
    }

    /* 保存状态样式 */
    #saveBtn.saving {
      background: #ffc107;
      border-color: #ffc107;
      color: #000;
    }

    #saveBtn.success {
      background: #28a745;
      border-color: #28a745;
    }

    #saveBtn.error {
      background: #dc3545;
      border-color: #dc3545;
    }

    .table-container {
      position: relative;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .table-container.fade-in {
      animation: fadeIn .28s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Edge scroll shadows */
    .table-container::before,
    .table-container::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20px;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .table-container::before {
      left: 0;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.9), transparent);
    }

    .table-container::after {
      right: 0;
      background: linear-gradient(to left, rgba(255, 255, 255, 0.9), transparent);
    }

    .table-container.has-left::before {
      opacity: 1;
    }

    .table-container.has-right::after {
      opacity: 1;
    }

    table {
      border: none;
      margin: 0;
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 12px 8px;
      text-align: center;
    }

    th {
      background: var(--soft);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr:nth-child(odd) {
      background: var(--soft);
    }

    tbody tr.active-row {
      background: #efefef;
    }

    /* 未确认行的视觉标识 */
    tbody tr.unconfirmed {
      background: #fff3cd !important;
      border-left: 4px solid #ffc107;
    }

    tbody tr.unconfirmed td {
      position: relative;
    }

    tbody tr.unconfirmed td::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 193, 7, 0.1);
      pointer-events: none;
    }

    /* 确认按钮样式 */
    .confirm-btn {
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 50px;
    }

    .confirm-btn.unconfirmed {
      border-color: #ffc107;
      color: #856404;
      background: #fff3cd;
    }

    .confirm-btn.unconfirmed:hover {
      background: #ffc107;
      color: #fff;
    }

    .confirm-btn.confirmed {
      border-color: #28a745;
      color: #155724;
      background: #d4edda;
      font-weight: bold;
    }

    .confirm-btn.confirmed:hover {
      background: #28a745;
      color: #fff;
    }

    /* 数量输入优化 */
    input[data-role="qty"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      transition: border-color .2s ease, box-shadow .2s ease;
      position: relative;
    }

    input[data-role="qty"]:focus {
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, .08);
      outline: none;
    }

    /* 输入框容器 - 用于放置确认按钮 */
    .qty-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* 内嵌式确认按钮 */
    .confirm-btn-inline {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: #f8f9fa;
      color: #6c757d;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .confirm-btn-inline.unconfirmed {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }

    .confirm-btn-inline.unconfirmed:hover {
      background: #ffc107;
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    .confirm-btn-inline.confirmed {
      background: #d4edda;
      color: #155724;
      border: 1px solid #28a745;
    }

    .confirm-btn-inline.confirmed:hover {
      background: #28a745;
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    /* 为内嵌按钮调整输入框右边距 */
    .qty-input-container input[data-role="qty"] {
      padding-right: 36px;
    }

    /* 移动端优化 */
    @media (max-width: 768px) {

      th,
      td {
        padding: 8px 4px;
        font-size: 14px;
      }

      input[data-role="qty"] {
        font-size: 16px;
        padding: 8px 32px 8px 8px;
      }

      .confirm-btn-inline {
        width: 20px;
        height: 20px;
        font-size: 10px;
        right: 2px;
      }

      .qty-input-container input[data-role="qty"] {
        padding-right: 28px;
      }
    }

    /* 订货数量列强调显示 */
    td[id^="box-"] {
      font-weight: 600;
      color: #000;
    }

    /* 可复制表头提示色弱化 */
    th.copyable {
      color: #111;
    }

    th.copyable::after {
      color: #999;
    }

    /* Toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      box-shadow: var(--shadow);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* 登录界面样式 */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-modal {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      max-width: 400px;
      width: 90%;
    }

    .login-modal h2 {
      margin: 0 0 20px 0;
      text-align: center;
      color: var(--fg);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-form input {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
    }

    .login-form input:focus {
      outline: none;
      border-color: #111;
    }

    .login-form button {
      margin-top: 10px;
    }

    /* 用户信息栏 */
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .user-name {
      color: var(--muted);
      font-size: 14px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: var(--soft);
    }

    /* 历史记录查询 */
    .history-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--soft);
      border-radius: 8px;
    }

    .history-controls input[type="date"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .history-controls button {
      padding: 8px 12px;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- 登录界面 -->
  <div id="loginOverlay" class="login-overlay" style="display: none;">
    <div class="login-modal">
      <h2>用户登录</h2>
      <form class="login-form" id="loginForm">
        <input type="text" id="username" placeholder="请输入用户名" required>
        <button type="button" id="loginBtn">登录</button>
      </form>
    </div>
  </div>

  <div class="controls">
    <input type="file" id="fileInput" />
    <button id="readBtn">读取Excel</button>
    <button id="copyBtn" disabled>复制订货数量</button>
    <button id="sortBtn" disabled>按paixu.txt排序</button>
    <button id="saveBtn" disabled>💾 保存数据</button>

    <!-- 用户信息 -->
    <div class="user-info" id="userInfo" style="display: none;">
      <span class="user-name" id="currentUser"></span>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <!-- 历史记录查询 -->
  <div class="history-controls" id="historyControls" style="display: none;">
    <label>查询日期：</label>
    <input type="date" id="queryDate">
    <button id="queryBtn">查询历史记录</button>
    <button id="clearBtn">清空当前</button>
  </div>

  <div id="result"></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true" style="display:block"></div>
  <script>

    // 全局常量与工具函数
    const LS_KEY_HTML = 'excel_saved_html_v1';
    const LS_KEY_DATA = 'excel_table_data_v1';
    const LS_KEY_USER = 'excel_current_user';
    const LS_KEY_LOGIN_TIME = 'excel_login_time';
    let __delegationBound = false;
    let originalTableData = []; // 保存原始表格数据（包含原始顺序索引）
    let currentDisplayData = []; // 当前显示的数据（可能是排序后的）
    let isSorted = false; // 当前是否为排序状态
    let paixuOrder = []; // 存储paixu.txt的排序顺序
    let currentUser = null; // 当前登录用户
    let confirmationStatus = new Map(); // 存储每行的确认状态 key: rowId, value: boolean

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return; t.textContent = msg; t.classList.add('show');
      clearTimeout(t.__to); t.__to = setTimeout(() => { t.classList.remove('show'); }, 1600);
    }
    function sanitizeNumber(str) {
      if (str === undefined || str === null) return '';
      const s = String(str).replace(/[,，\s]/g, '').replace(/[^\d.\-]/g, '');
      if (s === '' || s === '-' || s === '.' || s === '-.') return '';
      const n = parseFloat(s);
      return Number.isNaN(n) ? '' : String(n);
    }
    function computeBoxes(qtyStr, unitsPerBox, isBox) {
      if (!isBox) return '';
      const numStr = sanitizeNumber(qtyStr);
      if (numStr === '') return '';
      const qty = parseFloat(numStr);
      if (!unitsPerBox || !Number.isFinite(unitsPerBox) || unitsPerBox <= 0) return '';
      const boxes = qty / unitsPerBox;
      return String(Number(boxes.toFixed(4)));
    }

    // 确认状态管理函数
    function toggleConfirmation(rowId) {
      const currentStatus = confirmationStatus.get(rowId) || false;
      confirmationStatus.set(rowId, !currentStatus);
      updateRowConfirmationUI(rowId);
      saveTableData(); // 保存状态变化
      console.log(`行 ${rowId} 确认状态切换为:`, !currentStatus);
    }

    function updateRowConfirmationUI(rowId) {
      const tr = document.querySelector(`tr[data-row-id="${rowId}"]`);
      const btn = document.querySelector(`button.confirm-btn-inline[data-row-id="${rowId}"]`);
      if (!tr || !btn) return;

      const isConfirmed = confirmationStatus.get(rowId) || false;
      if (isConfirmed) {
        tr.classList.remove('unconfirmed');
        btn.classList.remove('unconfirmed');
        btn.classList.add('confirmed');
        btn.textContent = '✓';
        btn.title = '已确认';
      } else {
        tr.classList.add('unconfirmed');
        btn.classList.remove('confirmed');
        btn.classList.add('unconfirmed');
        btn.textContent = '○';
        btn.title = '点击确认';
      }
    }

    // 本地服务器数据存储管理
    isLocalServerEnabled = true; // 是否启用本地服务器存储
    isOnline = navigator.onLine; // 网络状态

    // 等待服务器检查完成
    function waitForServer() {
      return waitForServerCheck();
    }

    // 监听网络状态变化
    window.addEventListener('online', () => {
      isOnline = true;
      console.log('网络已连接，启用服务器同步');
      if (isLocalServerEnabled) {
        syncLocalToServer(); // 网络恢复时同步本地数据到服务器
      }
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      console.log('网络已断开，使用本地存储');
    });

    // 本地服务器数据保存
    async function saveToServer(key, data) {
      await waitForServer(); // 等待服务器检查

      if (!isLocalServerEnabled || !isOnline || !currentUser) {
        console.log('服务器保存跳过 - 服务器:', isLocalServerEnabled, '网络:', isOnline, '用户:', currentUser);
        return false;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/save`, {
          method: 'POST',
          mode: 'cors',
          cache: 'no-cache',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            userId: currentUser,
            key: key,
            data: data
          })
        });

        if (response.ok) {
          const result = await response.json();
          console.log('服务器保存成功 - 键:', key);
          return true;
        } else {
          console.error('服务器保存失败 - HTTP状态:', response.status);
          return false;
        }
      } catch (error) {
        console.error('服务器保存失败:', error);
        return false;
      }
    }

    // 本地服务器数据加载
    async function loadFromServer(key) {
      await waitForServer(); // 等待服务器检查

      if (!isLocalServerEnabled || !isOnline || !currentUser) {
        console.log('服务器加载跳过 - 服务器:', isLocalServerEnabled, '网络:', isOnline, '用户:', currentUser);
        return null;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/load/${currentUser}/${key}`, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        if (response.ok) {
          const result = await response.json();
          if (result.success && result.data !== null) {
            console.log('服务器加载成功 - 键:', key);
            return result.data;
          } else {
            console.log('服务器无数据 - 键:', key);
            return null;
          }
        } else {
          console.error('服务器加载失败 - HTTP状态:', response.status);
          return null;
        }
      } catch (error) {
        console.error('服务器加载失败:', error);
        return null;
      }
    }

    // 同步本地数据到服务器
    async function syncLocalToServer() {
      if (!currentUser || !isOnline) return;

      console.log('开始同步本地数据到服务器...');
      const keys = [LS_KEY_HTML, LS_KEY_DATA];

      for (const key of keys) {
        const localData = loadUserDataLocal(key);
        if (localData) {
          await saveToServer(key, localData);
        }
      }

      // 同步历史记录
      await syncHistoryToServer();
      console.log('本地数据同步到服务器完成');
    }

    // 同步历史记录到服务器
    async function syncHistoryToServer() {
      if (!currentUser || !isOnline) return;

      // 获取所有本地历史记录
      const allKeys = Object.keys(localStorage);
      const historyKeys = allKeys.filter(key => key.startsWith(`history_`) && key.endsWith(`_${currentUser}`));

      for (const historyKey of historyKeys) {
        const historyData = localStorage.getItem(historyKey);
        if (historyData) {
          const date = historyKey.replace(`history_`, '').replace(`_${currentUser}`, '');
          await saveToServer(`history_${date}`, JSON.parse(historyData));
        }
      }
    }

    // 服务器历史记录保存
    async function saveHistoryRecord(htmlData) {
      if (!currentUser || !htmlData) {
        console.log('历史记录保存失败 - 用户:', currentUser, '数据:', htmlData);
        return;
      }
      const today = new Date().toISOString().split('T')[0];

      // 添加时间戳和完整数据
      const record = {
        timestamp: new Date().toISOString(),
        data: htmlData,  // HTML内容
        originalData: originalTableData ? [...originalTableData] : [],
        displayData: currentDisplayData ? [...currentDisplayData] : [],
        isSorted: isSorted || false,
        // 添加当前输入框的值（库存量数据）
        inputValues: getCurrentInputValues(),
        // 添加确认状态
        confirmationStatus: Array.from(confirmationStatus.entries())
      };

      // 保存到本地
      const historyKey = `history_${today}_${currentUser}`;
      const existingData = localStorage.getItem(historyKey);
      const historyData = existingData ? JSON.parse(existingData) : [];
      historyData.push(record);
      localStorage.setItem(historyKey, JSON.stringify(historyData));

      // 保存到服务器
      await saveToServer(`history_${today}`, historyData);

      console.log('历史记录已保存 - 键:', historyKey, '记录数:', historyData.length, '表格数据行数:', record.displayData.length);

      if (user && loginTime) {
        const loginDate = new Date(loginTime);

    // 加载paixu.txt文件的排序顺序
    async function loadPaixuOrder() {
      try {
        const response = await fetch('./paixu.txt');
        const arrayBuffer = await response.arrayBuffer();
        // 使用TextDecoder正确解码UTF-8编码的文件
        const decoder = new TextDecoder('utf-8');
        const text = decoder.decode(arrayBuffer);
        paixuOrder = text.split('\n').map(line => line.trim()).filter(line => line);
        console.log('已加载paixu.txt排序顺序，共', paixuOrder.length, '项');
        console.log('前5项:', paixuOrder.slice(0, 5));
      } catch (error) {
        console.warn('无法加载paixu.txt文件:', error);
        paixuOrder = [];
      }
    }

    // 根据paixu.txt顺序获取商品的排序索引
    function getPaixuIndex(productName) {
      if (!productName) return 9999;

      // 首先尝试精确匹配
      let index = paixuOrder.findIndex(item => item === productName);
      if (index !== -1) {
        console.log(`getPaixuIndex: "${productName}" -> 精确匹配索引 ${index}`);
        return index;
      }

      // 然后尝试包含匹配
      index = paixuOrder.findIndex(item => productName.includes(item) || item.includes(productName));
      if (index !== -1) {
        console.log(`getPaixuIndex: "${productName}" -> 包含匹配索引 ${index} (匹配项: ${paixuOrder[index]})`);
        return index;
      }

      console.log(`getPaixuIndex: "${productName}" -> 未找到匹配，索引 9999`);
      return 9999; // 未找到的商品排在最后
    }

    function debounce(fn, delay = 300) {
      let t; return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
    }
    const debouncedSave = debounce(saveCurrentHTML, 300);
    const debouncedSaveUI = debounce(saveUIState, 150);

    function attachDelegationOnce() {
      if (__delegationBound) return; __delegationBound = true;
      const box = document.getElementById('result');
      if (!box) return;

      // 确认按钮点击事件
      box.addEventListener('click', (e) => {
        const el = e.target;
        if (el && el.matches && el.matches('button.confirm-btn-inline')) {
          const rowId = el.dataset.rowId;
          toggleConfirmation(rowId);
          e.preventDefault();
          e.stopPropagation();
        }
      });

      // 输入同步 + 防抖保存
      box.addEventListener('input', (e) => {
        const el = e.target;
        if (!(el && el.matches && el.matches('input[data-role="qty"]'))) return;
        const row = parseInt(el.dataset.row, 10);
        const upb = parseFloat(el.dataset.upb) || 1;
        const isBox = el.dataset.isbox === '1';
        const out = document.getElementById('box-' + row);
        if (!out) return;
        const numStr = sanitizeNumber(el.value);
        if (!isBox) {
          out.textContent = numStr; // 非"箱"直接同步
        } else {
          out.textContent = computeBoxes(numStr, upb, true);
        }

        // 更新内存中的数据
        if (currentDisplayData && currentDisplayData[row]) {
          currentDisplayData[row].qtyVal = numStr; // 更新qtyVal字段
          console.log('更新数据:', currentDisplayData[row]);

          // 同步更新所有相同行的库存量输入框
          const allQtyInputs = document.querySelectorAll(`input[data-role="qty"][data-row="${row}"]`);
          allQtyInputs.forEach(input => {
            if (input !== el) {
              input.value = numStr;
            }
          });

          // 输入后自动取消确认状态
          const rowId = currentDisplayData[row].rid;
          if (confirmationStatus.get(rowId)) {
            confirmationStatus.set(rowId, false);
            updateRowConfirmationUI(rowId);
          }
        }

        console.log('输入框变化 - 行:', row, '值:', numStr);
        // 移除自动保存，改为手动保存
        // debouncedSave();
      }, { passive: true });
      // 聚焦时选中内容 + 行高亮
      box.addEventListener('focusin', (e) => {
        const el = e.target;
        if (el && el.matches && el.matches('input[data-role="qty"]')) {
          try { el.select(); } catch (_) { }
          const tr = el.closest('tr');
          if (tr) tr.classList.add('active-row');
        }
      });
      box.addEventListener('focusout', (e) => {
        const el = e.target;
        if (el && el.matches && el.matches('input[data-role="qty"]')) {
          const tr = el.closest('tr');
          if (tr) tr.classList.remove('active-row');
        }
      });

      // 键盘事件处理 - Enter键确认
      box.addEventListener('keydown', (e) => {
        const el = e.target;
        if (el && el.matches && el.matches('input[data-role="qty"]') && e.key === 'Enter') {
          const row = parseInt(el.dataset.row, 10);
          if (currentDisplayData && currentDisplayData[row]) {
            const rowId = currentDisplayData[row].rid;
            toggleConfirmation(rowId);
            el.blur(); // 失去焦点
          }
          e.preventDefault();
        }
      });
    }

    async function copyOrderColumn() {
      const lines = getOrderValues().join('\n');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(lines);
        } else {
          const ta = document.createElement('textarea');
          ta.value = lines;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('已复制订货数量整列：' + (lines ? lines.split('\n').length : 0) + ' 行');
      } catch (e) {
        showToast('复制失败：' + (e && e.message ? e.message : e));

    // 滚动边缘指示
    function initScrollEdges() {
      const wrap = document.querySelector('#result .table-container');
      if (!wrap) return;
      function updateEdges() {
        const maxLeft = wrap.scrollWidth - wrap.clientWidth;
        const hasLeft = wrap.scrollLeft > 0;
        const hasRight = wrap.scrollLeft < maxLeft - 1; // 容差
        wrap.classList.toggle('has-left', hasLeft);
        wrap.classList.toggle('has-right', hasRight);
      }
      wrap.addEventListener('scroll', updateEdges, { passive: true });
      // 保存滚动位置
      wrap.addEventListener('scroll', () => { debouncedSaveUI(); }, { passive: true });
      window.addEventListener('resize', () => requestAnimationFrame(updateEdges));

    // 获取今日历史记录
    async function getTodayHistoryRecords(date) {
      if (!currentUser) return [];

      const allRecords = await getAllHistoryRecords();
      if (!allRecords || allRecords.length === 0) return [];

      const targetDate = new Date(date).toDateString();
      const todayRecords = allRecords.filter(record => {
        const recordDate = new Date(record.timestamp).toDateString();
        return recordDate === targetDate;
      });

      console.log('今日历史记录数量:', todayRecords.length);
      return todayRecords;
    }

    // 加载历史记录数据
    async function loadHistoryRecord(record) {
      if (!record) return;

      console.log('加载历史记录:', record);

      // 恢复表格数据到全局变量
      if (record.originalData && record.originalData.length > 0) {
        originalTableData = [...record.originalData];

        // 检查历史记录中是否保存了排序状态
        const savedSortState = record.isSorted || false;
        const savedDisplayData = record.displayData;

        if (savedSortState && savedDisplayData && savedDisplayData.length > 0) {
          // 如果历史记录中有排序状态和排序后的数据，恢复排序状态
          currentDisplayData = [...savedDisplayData];
          isSorted = savedSortState;
          console.log('恢复排序状态 - 排序状态:', isSorted, '显示数据行数:', currentDisplayData.length);
        } else {
          // 否则显示原始数据
          currentDisplayData = [...record.originalData];
          isSorted = false;
          console.log('恢复原序状态 - 原始数据行数:', originalTableData.length);

    // 获取所有历史记录的函数（支持服务器同步）
    async function getAllHistoryRecords() {
      if (!currentUser) return [];

      const allRecords = [];

      // 首先尝试从服务器加载历史记录
      await waitForServer(); // 等待服务器检查

      if (isOnline && isLocalServerEnabled) {
        try {
          console.log('从服务器加载历史记录...');
          const response = await fetch(`${API_BASE_URL}/history/${currentUser}`, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-cache',
            headers: {
              'Content-Type': 'application/json',
            }
          });

          if (response.ok) {
            const result = await response.json();
            if (result.success && result.data) {
              for (const [key, historyData] of Object.entries(result.data)) {
                if (key.startsWith('history_') && Array.isArray(historyData)) {
                  allRecords.push(...historyData);
                  console.log('从服务器加载历史记录:', key, '记录数:', historyData.length);
                }
              }
            }
          } else {
            console.error('服务器历史记录加载失败 - HTTP状态:', response.status);
          }

          if (allRecords.length > 0) {
            console.log('服务器历史记录加载完成，总记录数:', allRecords.length);
            return allRecords;
          }
        } catch (error) {
          console.error('服务器历史记录加载失败:', error);
        }
      }

      // 服务器不可用时从本地加载
      console.log('从本地加载历史记录...');
      const keys = Object.keys(localStorage);
      const userPrefix = `history_`;

      console.log('查找历史记录 - 用户:', currentUser, '所有localStorage键:', keys);

      keys.forEach(key => {
        // 检查键是否匹配历史记录格式：history_YYYY-MM-DD_username
        if (key.startsWith(userPrefix) && key.endsWith(`_${currentUser}`)) {
          console.log('找到匹配的历史记录键:', key);
          const data = localStorage.getItem(key);
          if (data) {
            try {
              const records = JSON.parse(data);
              if (Array.isArray(records)) {
                allRecords.push(...records);
                console.log('从键', key, '加载了', records.length, '条记录');
              }
            } catch (e) {
              console.error('解析历史记录失败:', e);
            }
          }
        }
      });

      console.log('总共找到历史记录:', allRecords.length);
      return allRecords;
    }

    function readExcel() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        showToast('请选择Excel文件');
        return;
      }

      // 先加载paixu.txt排序顺序
      loadPaixuOrder().then(() => {
        const reader = new FileReader();

        reader.onload = function (event) {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true, cellNF: true, cellText: true });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];

            const ref = sheet['!ref'];
            if (!ref) {
              document.getElementById('result').innerHTML = '<p>工作表没有可显示的数据。</p>';
              return;
            }

            const range = XLSX.utils.decode_range(ref);
            const merges = sheet['!merges'] || [];

            function escapeHtml(str) {
              return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              }[m]));
            }

            // 预处理合并单元格：记录每个合并区域的左上角及被覆盖的坐标
            const mergeTopLeft = new Map(); // key: "r:c" -> {rowspan, colspan}
            const mergeCovered = new Set(); // key: "r:c" -> true
            for (const m of merges) {
              const rowspan = m.e.r - m.s.r + 1;
              const colspan = m.e.c - m.s.c + 1;
              for (let rr = m.s.r; rr <= m.e.r; rr++) {
                for (let cc = m.s.c; cc <= m.e.c; cc++) {
                  const key = rr + ':' + cc;
                  if (rr === m.s.r && cc === m.s.c) {
                    mergeTopLeft.set(key, { rowspan, colspan });
                  } else {
                    mergeCovered.add(key);
                  }
                }
              }
            }

            function findMergeTopLeft(r, c) {
              for (let i = 0; i < merges.length; i++) {
                const m = merges[i];
                if (r >= m.s.r && r <= m.e.r && c >= m.s.c && c <= m.e.c) {
                  return { r: m.s.r, c: m.s.c };
                }
              }
              return null;
            }

            function getCell(r, c) {
              const addr = XLSX.utils.encode_cell({ r, c });
              let cell = sheet[addr];
              if (!cell) {
                const tl = findMergeTopLeft(r, c);
                if (tl) {
                  const tlAddr = XLSX.utils.encode_cell({ r: tl.r, c: tl.c });
                  cell = sheet[tlAddr];
                }
              }
              return cell;
            }

            function formatCell(cell) {
              if (!cell) return '';
              if (cell.w !== undefined) return escapeHtml(cell.w);
              if (cell.v === undefined || cell.v === null) return '';
              return escapeHtml(String(cell.v));
            }

            // 获取未转义的原始文本，仅用于表头识别匹配
            function rawText(cell) {
              if (!cell) return '';
              if (cell.w !== undefined) return String(cell.w);
              if (cell.v === undefined || cell.v === null) return '';
              return String(cell.v);
            }

            // 指定需要提取的列与同义词
            const targetDefs = [
              { key: 'code', title: '商品编码', synonyms: ['商品编码', '商品代码', '编码', '货号', '物料编码', '条码', 'SKU', 'SKU编码', '编号'] },
              { key: 'name', title: '商品名', synonyms: ['商品名', '商品名称', '品名', '名称', '物料名称', '产品名称'] },
              { key: 'spec', title: '规格', synonyms: ['规格', '规格型号', '型号', '规格/型号', '规格参数', '规格说明'] },
              { key: 'qty', title: '库存量', synonyms: ['库存量', '库存数量', '库存'] },
              { key: 'dian', title: '订货限定', synonyms: ['限定', '订货限定'] },
              { key: 'point', title: '订货单位', synonyms: ['订货单位'] }
            ];

            function normalize(str) {
              // 去除空格、全角空格及常见标点，转为统一比较基准
              return String(str)
                .replace(/[\s\u3000]/g, '')
                .replace(/[，。、""''：:；;（）()【】\[\]\-_/\\]/g, '')
                .toLowerCase();
            }

            function detectHeaderAndColumns(range) {
              let best = { row: range.s.r, map: new Map(), score: -1 };
              const maxRow = Math.min(range.e.r, range.s.r + 10); // 在前10行内尝试识别表头
              for (let r = range.s.r; r <= maxRow; r++) {
                const map = new Map();
                for (let c = range.s.c; c <= range.e.c; c++) {
                  const txt = rawText(getCell(r, c));
                  if (!txt) continue;
                  const norm = normalize(txt);
                  for (const def of targetDefs) {
                    if (map.has(def.key)) continue;
                    if (def.synonyms.some(s => {
                      const ns = normalize(s);
                      return norm.includes(ns) || ns.includes(norm);
                    })) {
                      map.set(def.key, c);
                    }
                  }
                }
                const score = map.size;
                if (score > best.score) {
                  best = { row: r, map, score };
                }
                if (score === targetDefs.length) break; // 全部识别到即可提前结束
              }
              return best;
            }

            // 识别表头行与目标列索引
            const { row: headerRow, map: colMap } = detectHeaderAndColumns(range);

            // 渲染所需列，并新增"订货数量(箱)"列
            let html = '<table>';
            html += '<thead><tr>';
            for (const def of targetDefs) {
              html += `<th>${escapeHtml(def.title)}</th>`;
            }
            html += '<th id="th-order" class="copyable" title="点击复制整列">订货数量</th>';
            html += '</tr></thead>';

            // 表体：自表头下一行开始逐行输出；库存量可输入；若订货单位为"箱"，则根据规格换算为"订货数量(箱)"
            html += '<tbody>';
            let rowSeq = 0;
            const tableData = []; // 收集表格数据
            for (let r = headerRow + 1; r <= range.e.r; r++) {
              // 收集当前行各列文本
              const rowObj = {};
              let isAllEmpty = true;
              for (const def of targetDefs) {
                const col = colMap.get(def.key);
                let text = '';
                if (col !== undefined) {
                  const cell = getCell(r, col);
                  text = formatCell(cell);
                  if (text !== '') isAllEmpty = false;
                }
                rowObj[def.key] = text;
              }
              if (isAllEmpty) continue;

              const specCol = colMap.get('spec');
              const rawSpec = specCol !== undefined ? rawText(getCell(r, specCol)) : '';
              const upb = parseUnitsPerBox(rawSpec);

              const pointCol = colMap.get('point');
              const rawPoint = pointCol !== undefined ? rawText(getCell(r, pointCol)) : '';
              const isBoxUnit = /箱/.test(rawPoint || '');

              const qtyCol = colMap.get('qty');
              const rawQty = qtyCol !== undefined ? rawText(getCell(r, qtyCol)) : '';
              const qtyVal = sanitizeNumber(rawQty);

              const rid = String(rowSeq++);
              const initBox = computeBoxes(qtyVal, upb, isBoxUnit);

              // 保存到数据数组
              const rowData = {
                ...rowObj,
                rid,
                upb,
                isBoxUnit,
                qtyVal,
                initBox,
                originalIndex: tableData.length
              };
              tableData.push(rowData);

              html += '<tr>';
              for (const def of targetDefs) {
                if (def.key === 'qty') {
                  html += `<td><input type="number" inputmode="decimal" step="any" value="${escapeHtml(qtyVal)}" data-role="qty" data-row="${rid}" data-upb="${Number.isFinite(upb) ? upb : ''}" data-isbox="${isBoxUnit ? '1' : '0'}" /></td>`;
                } else {
                  html += `<td>${rowObj[def.key]}</td>`;
                }
              }
              html += `<td id="box-${rid}">${isBoxUnit ? (initBox || '') : qtyVal}</td>`;
              html += '</tr>';
            }
            html += '</tbody></table>';

            // 保存原始数据
            originalTableData = tableData;
            currentDisplayData = [...tableData];
            isSorted = false;
            saveTableData();

            document.getElementById('result').innerHTML = `<div class="table-container">${html}</div>`;
            const tc = document.querySelector('#result .table-container');
            if (tc) tc.classList.add('fade-in');
            enableCopyControls();
            attachDelegationOnce();
            initScrollEdges();
            // 移除Excel读取后的自动保存，改为手动保存
            // saveCurrentHTML();
          } catch (err) {
            console.error(err);
            document.getElementById('result').innerHTML = `<p>读取文件时出错：${escapeHtml(err.message)}</p>`;
          }
        };

        reader.readAsArrayBuffer(file);
      }); // 结束loadPaixuOrder().then()
    }
    // 页面加载时初始化用户管理
    window.addEventListener('DOMContentLoaded', function () {
      // 首先加载paixu.txt排序顺序
      loadPaixuOrder().then(() => {
        console.log('页面初始化时已加载paixu.txt排序顺序');
      });

      // 检查登录状态
      if (checkLoginStatus()) {
        showUserInterface();
        tryRestoreUserData();
      } else {
        showLoginInterface();
      }

      // 绑定登录相关事件
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const queryBtn = document.getElementById('queryBtn');
      const clearBtn = document.getElementById('clearBtn');
      const saveBtn = document.getElementById('saveBtn');
      const loginForm = document.getElementById('loginForm');

      if (loginBtn) loginBtn.addEventListener('click', login);
      if (logoutBtn) logoutBtn.addEventListener('click', logout);
      if (queryBtn) queryBtn.addEventListener('click', queryHistoryByDate);
      if (clearBtn) clearBtn.addEventListener('click', clearHistoryQuery);
      if (saveBtn) saveBtn.addEventListener('click', manualSave);

      // 表单提交事件（防止页面刷新）
      if (loginForm) {
        loginForm.addEventListener('submit', function (e) {
          e.preventDefault();
          login();
        });
      }

      // 用户名输入框回车登录
      const usernameInput = document.getElementById('username');
      if (usernameInput) {
        usernameInput.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            login();
          }
        });
      }
    });

    // 页面加载时尝试还原（保留原有功能，但仅在用户已登录时执行）
    async function tryRestoreFromLocal() {
      if (!currentUser) return;
      await tryRestoreUserData();
    }

    // 移除自动调用，避免在排序后重置状态
    // tryRestoreFromLocal();
    // 绑定"读取Excel"按钮（替代内联事件）
    (function bindReadBtn() { const btn = document.getElementById('readBtn'); if (btn) btn.addEventListener('click', readExcel); })();
  </script>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true" style="display:block"></div>
